spring.application.name=SpringAi

# Load secrets from server/.env (KEY=value lines). Optional, so the app still starts
# when the variable is set in the real environment instead (e.g. in production).
spring.config.import=optional:file:.env[.properties]

# Which provider backs each kind of model. Switching chat to another provider
# (e.g. ollama) is a one-line change here once its starter is on the classpath.
spring.ai.model.chat=google-genai
spring.ai.model.image=openai

# Gemini (chat) - free key from https://aistudio.google.com/apikey
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-3.5-flash

# OpenAI (images only - Gemini's free tier has no image generation)
spring.ai.openai.api-key=${OPENAI_API_KEY}
